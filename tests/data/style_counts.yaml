  # GSM8K, 345, Qwen/Qwen1.5-14B-Chat
  - text: |
      To calculate the total number of legs, we need to multiply the number of tables with each type by the number of legs they have and then add the two totals together.

      For the tables with 4 legs:
      \( 40 \text{ tables} \times 4 \text{ legs/table} = 160 \text{ legs} \)

      For the tables with 3 legs:
      \( 50 \text{ tables} \times 3 \text{ legs/table} = 150 \text{ legs} \)

      Now, we add the two totals together:
      \( 160 \text{ legs} + 150 \text{ legs} = 310 \text{ legs} \)

      So, the restaurant's tables have a total of 310 legs.
